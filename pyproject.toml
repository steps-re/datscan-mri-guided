[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datscan-mri"
version = "0.1.0"
description = "MRI-guided regional analysis of 123I-FP-CIT (DaTscan) SPECT/CT. Research tool, not a medical device."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "SimpleITK==2.5.7",
  "nibabel==5.4.2",
  "pydicom==3.0.2",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
datscan-mri = "datscan_mri.cli:main"

[tool.setuptools]
packages = ["datscan_mri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
